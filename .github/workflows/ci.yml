name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term --cov-fail-under=90

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=2 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    needs: [backend, gateway, frontend]
    env:
      BOT_DELAY_MS: 150
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build --detach --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the browser
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Play a game against bots
        working-directory: e2e
        run: npm test
        env:
          BASE_URL: http://localhost:3000
          PLAYERS: 1
          BOTS: 3
      - name: Show logs
        if: failure()
        run: docker compose logs --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e/screenshots
