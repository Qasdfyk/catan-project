services:
  # --- SERVICE 1: REDIS ---
  redis:
    image: redis:7-alpine
    container_name: catan_redis
    volumes:
      - redis_data:/data # Persist data to a volume
    networks:
      - catan_net
    # Healthcheck: Allows the backend to wait until Redis is fully ready
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- SERVICE 2: BACKEND (rules, rooms) ---
  backend:
    build:
      context: ./backend  # Path to the directory containing Dockerfile
      dockerfile: Dockerfile
    container_name: catan_backend
    environment:
      - PROJECT_NAME=Catan Docker
      # IMPORTANT: Using Docker DNS. 'redis' refers to the service name defined above.
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key}
      - RECORDS_DIR=/data/records
    volumes:
      - records:/data/records # Finished games, docs/game-record.md
    depends_on:
      redis:
        condition: service_healthy # Wait for Redis healthcheck to pass
    networks:
      - catan_net
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- SERVICE 3: GATEWAY (WebSocket connections, Go) ---
  gateway:
    build:
      context: ./gateway
    container_name: catan_gateway
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - catan_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- SERVICE 4: BOTS (fill empty seats, turn timer, Go) ---
  bots:
    build:
      context: ./gateway
    container_name: catan_bots
    command: ["bots"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GATEWAY_URL=ws://gateway:8080/ws
      - BACKEND_URL=http://backend:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key}
      - BOT_DELAY_MS=${BOT_DELAY_MS:-900}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - catan_net

  # --- SERVICE 5: FRONTEND (static files, routes /api and /ws) ---
  frontend:
    build:
      context: ./frontend
    container_name: catan_frontend
    ports:
      - "3000:80" # The game: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - catan_net

# Define custom bridge network
networks:
  catan_net:
    driver: bridge

# Define persistent storage for Redis
volumes:
  redis_data:
  records:
